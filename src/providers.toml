# Built-in providers. A provider is one OAuth realm: one login, one token.
# ~/.config/sesame/providers.toml may add providers or replace one by name.
#
# `[[<provider>.setup]]` entries are the steps `sesame setup <provider>` prints
# to register the OAuth app: `title`, the `page` to open, and `details` of what
# to click, fill in and pick. In `details`, `{callback}` is the redirect URL
# login uses and `{scopes}` the provider's `scopes`, so neither is written twice.
# sesame adds the closing steps itself (store the client, log in, call the API).

[google]
about = "Google APIs: Drive, Docs, Sheets, YouTube, ..."
auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
api_base = "https://www.googleapis.com"
hosts = ["*.googleapis.com"]
scopes = [
  "openid",
  "email",
  "https://www.googleapis.com/auth/drive.readonly",
  "https://www.googleapis.com/auth/documents.readonly",
  "https://www.googleapis.com/auth/youtube.readonly",
]
auth_params = { access_type = "offline", prompt = "consent" }

[[google.setup]]
title = "Create or pick a Google Cloud project"
page = "https://console.cloud.google.com/projectcreate"
details = """
To reuse a project, pick it in the project picker at the top of the console instead.
For a new one: enter a Project name, click Create, and wait until the console opens its Dashboard.
Every later step happens in this project: check the project picker shows it."""

[[google.setup]]
title = "Enable the Google Drive API"
page = "https://console.cloud.google.com/apis/library/drive.googleapis.com"
details = "Click Enable."

[[google.setup]]
title = "Enable the Google Docs API"
page = "https://console.cloud.google.com/apis/library/docs.googleapis.com"
details = "Click Enable."

[[google.setup]]
title = "Enable the YouTube Data API v3"
page = "https://console.cloud.google.com/apis/library/youtube.googleapis.com"
details = "Click Enable."

[[google.setup]]
title = "Configure the consent screen (Google Auth Platform > Branding)"
page = "https://console.cloud.google.com/auth/branding"
details = """
If it says \"Google Auth platform not configured yet\", click Get Started, then:
- App Information: App name (anything, e.g. \"sesame\"), User support email (your own).
- Audience: External (Internal only if every user is in your Google Workspace organization).
- Contact Information: your email address.
- Finish: tick \"I agree to the Google API Services: User Data Policy\", click Continue, then Create."""

[[google.setup]]
title = "Add yourself as a test user (Google Auth Platform > Audience)"
page = "https://console.cloud.google.com/auth/audience"
details = """
Under Test users click Add users, enter the Google account email you will sign in with, click Save.
While the app's Publishing status is Testing, only test users can sign in, and Google lets
their refresh token expire 7 days after consent: then `sesame login google` must run again.
To stay signed in longer, click Publish app on this page (status becomes In production).
The app is unverified, so the sign-in page shows an \"unverified app\" warning, and Google
caps an unverified app at 100 users over its lifetime; for your own use that is fine."""

[[google.setup]]
title = "Create the OAuth client (Google Auth Platform > Clients)"
page = "https://console.cloud.google.com/auth/clients"
details = """
Click Create Client.
- Application type: Desktop app (not Web application).
- Name: anything, e.g. \"sesame\"; only the console shows it.
Click Create. No redirect URI is entered: a Desktop app client accepts {callback}.
The dialog that opens shows the Client ID and Client secret; keep it open for the next step.
The scopes sesame asks for at login: {scopes}"""

[jira]
about = "Jira Cloud (Atlassian OAuth 2.0 3LO)"
auth_url = "https://auth.atlassian.com/authorize"
token_url = "https://auth.atlassian.com/oauth/token"
token_body = "json"
api_base = "https://api.atlassian.com/ex/jira/{resource_id}"
hosts = ["api.atlassian.com"]
scopes = ["read:jira-work", "write:jira-work", "read:jira-user", "offline_access"]
auth_params = { audience = "api.atlassian.com", prompt = "consent" }
resources_url = "https://api.atlassian.com/oauth/token/accessible-resources"
redirect_port = 8749

[[jira.setup]]
title = "Create an OAuth 2.0 integration in the Atlassian developer console"
page = "https://developer.atlassian.com/console/myapp/"
details = """
Sign in with the Atlassian account that can see your Jira site.
Open the Create menu and choose OAuth 2.0 integration.
Enter a name (e.g. \"sesame\") and finish creating it; the app's page opens with a left menu."""

[[jira.setup]]
title = "Add the Jira API and its scopes (left menu: Permissions)"
details = """
Next to Jira API, click Add. Then click Configure next to it, and in the list of scopes
click Add next to each one sesame asks for: {scopes}
(offline_access is not in that list: it is what gives sesame a refresh token, and sesame asks for it at login)."""

[[jira.setup]]
title = "Set the callback URL (left menu: Authorization)"
details = """
Next to OAuth 2.0 (3LO), click Configure.
Callback URL: {callback}
It must match exactly, so do not change localhost or the port. Click Save changes."""

[[jira.setup]]
title = "Copy the client ID and secret (left menu: Settings)"
details = "The authentication details show the Client ID and Secret. Keep the page open for the next step."
