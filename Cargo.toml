[package]
name = "sesame"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-help = { git = "https://github.com/sunfmin/agent-cli", rev = "f506df826a97b2fd834e1d65b9057001a6a6e796" }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
opcore = { git = "https://github.com/sunfmin/opcore", rev = "6a34c61d76a2e3e69be83f3a34102c89003156cb" }
open = "5.4.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "form", "query"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
url = "2.5.8"

