[package]
name = "sesame"
version = "0.1.1"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
open = "5.4.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "form", "query"] }
