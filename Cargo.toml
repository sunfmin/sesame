[package]
name = "sesame"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-help = { git = "https://github.com/sunfmin/agent-cli", rev = "f506df826a97b2fd834e1d65b9057001a6a6e796" }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
hkdf = "0.13.0"
open = "5.4.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "form", "query"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
url = "2.5.8"

# The fake 1Password CLI the tests put on PATH as `op`; built by `cargo test`.
[[example]]
name = "fake-op"
path = "tests/support/fake_op.rs"
