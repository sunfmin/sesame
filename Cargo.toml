[package]
name = "saas"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
open = "5.4.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "form", "query"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
url = "2.5.8"
